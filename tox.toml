requires = ["tox>=4.32.0"]
env_list = ["py314"]
skip_missing_interpreters = false

[env.py314]
description = "Validate the Poetry lockfile, lint, formatting and tests on Python 3.14"
base_python = ["python3.14"]
# Poetry installs the editable project and locked dependencies into this environment.
package = "skip"
allowlist_externals = ["poetry"]
pass_env = ["POETRY_CACHE_DIR"]
set_env = { VIRTUAL_ENV = "{env_dir}", POETRY_VIRTUALENVS_CREATE = "false", POETRY_NO_INTERACTION = "1", MLFLOW_DISABLE_TELEMETRY = "true" }
commands_pre = [
    ["python", "scripts/check_test_environment.py"],
    ["poetry", "check", "--lock"],
    ["poetry", "sync", "--only", "main,pipeline,dev"],
]
commands = [
    ["python", "-m", "ruff", "check", "."],
    ["python", "-m", "ruff", "format", "--check", "."],
    ["python", "-m", "pytest", "-q", { replace = "posargs", default = ["tests"], extend = true }],
]

# Explicit service-interruption check. Never part of env_list; the live test is skipped in the default suite.
[env.exporter-recovery]
description = "Opt-in live exporter outage, Prometheus alert and recovery check"
base_python = ["python3.14"]
package = "skip"
allowlist_externals = ["poetry"]
pass_env = ["POETRY_CACHE_DIR", "DOCKER_HOST", "DOCKER_CONTEXT", "DOCKER_CONFIG", "XDG_RUNTIME_DIR"]
set_env = { VIRTUAL_ENV = "{env_dir}", POETRY_VIRTUALENVS_CREATE = "false", POETRY_NO_INTERACTION = "1", MLFLOW_DISABLE_TELEMETRY = "true", FRAUD_EXPORTER_RECOVERY_LIVE = "1", FRAUD_PROJECT_ROOT = "{tox_root}" }
commands_pre = [
    ["python", "scripts/check_test_environment.py"],
    ["poetry", "check", "--lock"],
    ["poetry", "sync", "--only", "main,pipeline,dev"],
]
commands = [
    ["python", "-m", "pytest", "-q", "-s", "tests/monitoring/live/test_exporter_recovery.py"],
]

# Operational SDK isolated from the scientific lock; no service/network calls in tests.
