services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: mlflow_lab
      POSTGRES_USER: tracking_admin
      POSTGRES_PASSWORD: ${TARGET_PG_ADMIN_PASSWORD:?Private rehearsal env required}
      TRACKING_PG_PASSWORD: ${TARGET_PG_PASSWORD:?Private rehearsal env required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/10-mlflow.sh:ro
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, mlflow, -d, mlflow_lab]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${TARGET_S3_ACCESS_KEY:?Private rehearsal env required}
      RUSTFS_SECRET_KEY: ${TARGET_S3_SECRET_KEY:?Private rehearsal env required}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [rustfs-data:/data]
    command: [/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1
  mlflow:
    image: fraud-tracking-restore:lab-v1
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://mlflow:${TARGET_PG_PASSWORD}@postgres:5432/mlflow_lab
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_BOTO_CLIENT_ADDRESSING_STYLE: path
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SQL_TRACE_ROLLUPS_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${TARGET_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${TARGET_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1", --serve-artifacts, --artifacts-destination, "s3://fraud-tracking-lab/v1", --allowed-hosts, "127.0.0.1:15002,localhost:15002,mlflow:5000,127.0.0.1:5000"]
    ports: ["127.0.0.1:15002:5000"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 1g
    cpus: 1
  seed:
    profiles: [tools]
    image: fraud-tracking-restore:lab-v1
    entrypoint: [python, -m, scripts.tracking.restore_worker]
    command: [seed]
    user: "${RESTORE_UID}:${RESTORE_GID}"
    environment:
      TARGET_PG_PASSWORD: ${TARGET_PG_PASSWORD}
      AWS_ACCESS_KEY_ID: ${TARGET_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${TARGET_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      CAPTURE_PATH: /capture/${CAPTURE_ID}
      CAPTURE_MANIFEST_SHA256: ${CAPTURE_MANIFEST_SHA256}
    volumes:
      - type: bind
        source: ${RESTORE_CAPTURE_DIRECTORY}
        target: /capture/${CAPTURE_ID}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RESTORE_PROOF_DIRECTORY}
        target: /proof
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1
  client:
    profiles: [tools]
    image: fraud-tracking-restore:lab-v1
    entrypoint: [python, -m, scripts.tracking.restore_worker]
    command: [client]
    user: "${RESTORE_UID}:${RESTORE_GID}"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_REGISTRY_URI: http://mlflow:5000
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
    volumes:
      - type: bind
        source: ${RESTORE_PROOF_DIRECTORY}
        target: /proof
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    cpus: 1
volumes:
  postgres-data:
  rustfs-data:
networks:
  default:
    internal: true
