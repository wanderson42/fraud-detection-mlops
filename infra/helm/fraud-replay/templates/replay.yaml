apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-state
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations:
    helm.sh/resource-policy: keep
    fraud.replay/run-id: {{ .Values.runId | quote }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.replay/run-id: {{ .Values.runId | quote }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
      annotations: {fraud.replay/run-id: {{ .Values.runId | quote }}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: replay
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          args: [--run-id, {{ .Values.runId | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-state}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
