---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-exporter
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: exporter}
  ports:
{{- if .Values.legacyReplay }}
    - {name: http, port: 19100, targetPort: 19100}
{{- end }}
{{- if .Values.sessionTelemetry.enabled }}
    - {name: session, port: 19102, targetPort: 19102}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-exporter
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 0 .Values.stateReady }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform, app.kubernetes.io/component: exporter}
      annotations:
        {{- include "obs.owner" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
{{- if .Values.legacyReplay }}
        - name: exporter
          image: {{ .Values.images.exporter | quote }}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
          ports: [{name: http, containerPort: 19100}]
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /state, readOnly: true}
{{- end }}
{{- if .Values.sessionTelemetry.enabled }}
        - name: session-exporter
          image: {{ .Values.sessionTelemetry.image | quote }}
          imagePullPolicy: Never
          args: [--binding, /binding/binding.json]
          env:
            - name: FRAUD_SESSION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-session-token, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: '1', memory: 128Mi}
          ports: [{name: session, containerPort: 19102}]
          readinessProbe:
            httpGet: {path: /healthz, port: session}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: session}
            periodSeconds: 15
          volumeMounts:
            - {name: session-binding, mountPath: /binding, readOnly: true}
{{- end }}
      volumes:
{{- if .Values.sessionTelemetry.enabled }}
        - name: session-binding
          configMap: {name: {{ .Release.Name }}-session-binding}
{{- end }}
{{- if .Values.legacyReplay }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-state, readOnly: true}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 0 .Values.stateReady }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform, app.kubernetes.io/component: prometheus}
      annotations:
        {{- include "obs.owner" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus | quote }}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
          ports: [{name: http, containerPort: 9090}]
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=48h, --storage.tsdb.retention.size=512MB]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-prometheus}
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "obs.labels" . | nindent 4 }}
  annotations:
    {{- include "obs.owner" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 0 .Values.stateReady }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform, app.kubernetes.io/component: grafana}
      annotations:
        {{- include "obs.owner" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.images.grafana | quote }}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
          ports: [{name: http, containerPort: 3000}]
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/fraud-dashboards, readOnly: true}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: fraud-observability-credentials, key: password}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: {{ ternary "/var/lib/fraud-dashboards/kind-overview.json" "/var/lib/fraud-dashboards/product-session.json" .Values.legacyReplay }}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: 'false'}
            # Keep bundled datasource plugins supplied by the pinned image on restart.
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: 'false'}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-grafana}
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: dashboards
          configMap: {name: {{ .Release.Name }}-dashboards}
