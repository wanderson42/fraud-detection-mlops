apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fraud.name" . }}-rustfs
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fraud.name" . }}-rustfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "fraud.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [/data]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: api
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: rustfs-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: rustfs-secret-key
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: run
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fraud.name" . }}-rustfs-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
