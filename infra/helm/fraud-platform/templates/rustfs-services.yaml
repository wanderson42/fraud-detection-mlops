apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud.name" . }}-rustfs
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud.name" . }}-rustfs-headless
  labels:
    {{- include "fraud.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: api
