apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-plan
  annotations: {fraud.round/owner-id: {{ .Values.ownerId | quote }}}
immutable: true
data:
  plan.json: {{ .Values.planJSON | quote }}
  transport.py: {{ .Values.transportScript | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.round/owner-id: {{ .Values.ownerId | quote }}, fraud.round/id: {{ .Values.roundId | quote }}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
      annotations: {fraud.round/owner-id: {{ .Values.ownerId | quote }}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: download
          image: {{ .Values.transportImage | quote }}
          imagePullPolicy: Never
          command: [python, /plan/transport.py]
          env:
            - {name: ROUND_GOLD_BUNDLE_ID, value: {{ .Values.goldBundleId | quote }}}
            - {name: ROUND_DATASET_OWNER, value: {{ .Values.datasetOwner | quote }}}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
            - {name: AWS_SHARED_CREDENTIALS_FILE, value: /dev/null}
            - {name: AWS_CONFIG_FILE, value: /dev/null}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: fraud-platform-credentials, key: rustfs-access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: fraud-platform-credentials, key: rustfs-secret-key}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: plan, mountPath: /plan, readOnly: true}
      containers:
        - name: train
          image: {{ .Values.trainerImage | quote }}
          imagePullPolicy: Never
          args: [--plan, /plan/plan.json]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: '1', memory: 2Gi}
            limits: {cpu: '2', memory: 4Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: plan, mountPath: /plan, readOnly: true}
      volumes:
        - {name: work, emptyDir: {sizeLimit: 2Gi}}
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
        - name: plan
          configMap: {name: {{ .Release.Name }}-plan, defaultMode: 292}
