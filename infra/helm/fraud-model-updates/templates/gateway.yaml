apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-active
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.serving/owner-id: {{ .Values.ownerId | quote }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: {{ .Values.activeSlot }}}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.serving/owner-id: {{ .Values.ownerId | quote }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.serving/owner-id: {{ .Values.ownerId | quote }}}
immutable: true
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log stderr warn;
    worker_processes 1;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        client_max_body_size 128k;
        location = /gateway-health { default_type text/plain; return 200 'ready'; }
        location / {
          proxy_pass http://{{ .Release.Name }}-active:8000;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_connect_timeout 1s;
          proxy_read_timeout 5s;
          proxy_send_timeout 5s;
          proxy_next_upstream off;
          proxy_intercept_errors on;
          error_page 502 503 504 =502 @unavailable;
        }
        location @unavailable { default_type application/json; return 502 '{"error":"upstream_unavailable"}'; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway, app.kubernetes.io/part-of: fraud-platform}
  annotations: {fraud.serving/owner-id: {{ .Values.ownerId | quote }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway, app.kubernetes.io/part-of: fraud-platform}
      annotations: {fraud.serving/owner-id: {{ .Values.ownerId | quote }}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: fraud-platform-control-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.images.gateway | quote }}
          imagePullPolicy: Never
          command: [nginx]
          args: [-c, /config/nginx.conf, -e, stderr, -g, 'daemon off;']
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /gateway-health, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /gateway-health, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /gateway-health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-gateway}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
